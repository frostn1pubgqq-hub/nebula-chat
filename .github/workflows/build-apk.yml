name: Build Nebula Chat APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extract project
        run: unzip -q nebula-chat-project.zip -d source

      - name: Build Android APK
        working-directory: source/nebula-chat/client
        run: |
          npm install
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli
          npm run build
          npx cap init "Nebula Chat" "com.nebulachat.app" --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: Fix Kotlin dependency conflict
        working-directory: source/nebula-chat/client/android
        run: |
          cat >> build.gradle <<'EOF'
          allprojects {
            configurations.configureEach {
              resolutionStrategy.eachDependency { details ->
                if (details.requested.group == "org.jetbrains.kotlin" &&
                    details.requested.name == "kotlin-stdlib-jdk8") {
                  details.useVersion "1.8.22"
                }
              }
            }
          }
          EOF

      - name: Build debug APK
        working-directory: source/nebula-chat/client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Nebula-Chat-APK
          path: source/nebula-chat/client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
